<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<!-- FIX 1: Font Awesome moved here. @import placed mid-stylesheet is invalid and was ignored,
     so the play/mute icons never rendered (empty music button). -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
<title>Happy Womens Day</title>
<style>
*
{
margin: 0;
padding: 0;
box-sizing: border-box;
-webkit-tap-highlight-color: transparent;
}

body
{
height: 100vh;
background-color: #fae1dd;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
position: relative;
}

.music-controls {
position: fixed;
top: 20px;
right: 20px;
display: flex;
flex-direction: column;
align-items: center;
z-index: 100;
}

.music-toggle {
width: 50px;
height: 50px;
border-radius: 50%;
background-color: #ee6779;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
transition: all 0.3s ease;
border: 2px solid #fd556c;
margin-bottom: 5px;
}

.music-toggle:hover {
transform: scale(1.1);
box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
}

.music-toggle i {
color: white;
font-size: 24px;
}

.music-toggle.playing {
background-color: #ee6779;
border: 3px solid white;
}

.music-label {
font-family: "Varela Round", sans-serif;
color: #ee6779;
font-size: 14px;
font-weight: 600;
text-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
}

.evelope {
position: relative;
z-index: 1;
top: -5px;
}
.evelope::before {
content: "";
position: absolute;
height: 300px;
width: 300px;
background-color: #fd556c;
top: -135px;
left: 50px;
rotate: 45deg;
border-radius: 28px;
box-shadow: 5px 5px 15px rgba(46, 42, 42, 0.4);
}
.container
{
position: relative;
top: 18%;
animation: float 3s ease-in-out infinite;
width: 90%;
max-width: 420px;
z-index: 10;
opacity: 0;
transition: opacity 2s ease;
}

@keyframes float {
0%, 100% {
transform: translateY(0);
}
50% {
transform: translateY(-16px);
}
}

.card-hb
{
position: relative;
height: 250px;
width: 100%;
max-width: 400px;
background-color: #ee6779;
border-radius: 10px 10px 20px 20px;
box-shadow: 0 10px 25px rgba(46, 42, 42, 0.5);
pointer-events: auto;
transition: transform 0.4s ease, box-shadow 0.4s ease;
margin: 0 auto;
}

.card-hb:hover {
transform: translateY(-25px);
box-shadow: 0 15px 35px rgba(46, 42, 42, 0.6);
animation-play-state: paused;
}

/* FIX 5: removed invalid nested @media blocks (media queries cannot be nested
   inside a regular rule) — the responsive hover offsets now live in the
   media query sections at the bottom of this stylesheet. */
.card-hb:hover .card {
transform: translateY(-160px);
box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25), inset 0 0 10px rgba(0, 0, 0, 0.1);
}

.card-hb.disabled-hover:hover {
transform: none;
box-shadow: 0 10px 25px rgba(46, 42, 42, 0.5);
}

.card-hb.disabled-hover:hover .card {
transform: none;
box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
}

.card-hb::before {
content: "";
position: absolute;
height: 300px;
width: 298px;
background-color: #fd556c;
top: -135px;
left: 51px;
rotate: 225deg;
pointer-events: auto;
border-radius: 28px;

box-shadow: 5px 5px 15px rgba(46, 42, 42, 0.4);
}

.hide {
position: absolute;
height: 250px;
width: 420px;
top: -250px;
left: -10px;
background-color: #fae1dd;
z-index:2;
}

.open {
position: absolute;
width: 25px;
height: 40px;
top: 55%;
left: 45%;
background-color: #ffffff;
transform: rotate(-45deg);
border-top-left-radius: 15px;
border-top-right-radius: 15px;
z-index: 3;
cursor: pointer;
transition: transform 0.3s ease;
}

.open:hover {
transform: rotate(-45deg) scale(1.1);
}

.open::before {
content: "";
position: absolute;
width: 25px;
height: 40px;
left: 8px;
top: 8px;
background-color: #ffffff;
transform: rotate(90deg);
border-top-left-radius: 15px;
border-top-right-radius: 15px;
z-index: 3;
}

.card
{
position: absolute;
height: 230px;
width: 370px;
background-color: rgb(255, 255, 255);
border-radius: 8px 8px 8px 8px;
top: -0px;
left: 14px;
transition: 1.5s;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 20px;
text-align: center;
box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
transition: transform 0.4s ease, box-shadow 0.4s ease;
pointer-events: auto;
cursor: pointer;
}

.text {
font-size: 40px;
color: #ee6779;
font-family: 'Brush Script MT', cursive;
font-weight: bold;
margin-bottom: 10px;
text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
}

.text-a {
color: #fd556c;
font-family: "Quicksand", sans-serif;
font-weight: 700;
margin-bottom: 15px;
}

.gift-i {
font-size: 16px;
color: #666;
line-height: 1.5;
font-family: "Varela Round", sans-serif;
min-height: 30px;
}

.out {
position: absolute;
border-right: 200px #ff94a3 solid;
border-bottom: 125px solid transparent;
border-top: 120px solid transparent;
top: 7px;
left: 200px;
border-radius: 0 0 20px 20px;
}
.out::before {
content: "";
position: absolute;
border-left: 408px #fd556c solid;
border-top: 245px solid transparent;
left: -200px;
top: -120px;
border-radius: 0px 0 32px 20px;
}

/* ---- Heart intro burst + endless falling hearts (ported from the Valentine version) ---- */
#intro-container
{
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
z-index: 9999;
pointer-events: none;
overflow: hidden;
}

.intro-heart
{
position: absolute;
width: 20px;
height: 32px;
background-color: var(--heart-color);
border-top-left-radius: 20px;
border-top-right-radius: 20px;
opacity: 0;
will-change: transform, opacity;
animation: bloomShakeAndFall 4.5s ease-in-out forwards;
}

.intro-heart::before
{
content: "";
position: absolute;
width: 20px;
height: 32px;
left: 6px;
top: 6px;
background-color: var(--heart-color);
transform: rotate(90deg);
border-top-left-radius: 20px;
border-top-right-radius: 20px;
}

@keyframes bloomShakeAndFall
{
0% { transform: rotate(-45deg) scale(0); opacity: 0; }
15% { opacity: 1; transform: rotate(-45deg) scale(var(--final-scale)); }
30% { transform: rotate(-40deg) scale(var(--final-scale)); }
40% { transform: rotate(-50deg) scale(var(--final-scale)); }
50% { transform: rotate(-45deg) scale(var(--final-scale)); opacity: 1; }
100% { transform: rotate(-45deg) scale(var(--final-scale)) translate3d(0, 120vh, 0); opacity: 0; }
}

#falling-hearts-container
{
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: 98;
pointer-events: none;
overflow: hidden;
}

.falling-heart-wrapper
{
position: absolute;
top: -10%;
will-change: transform;
animation: fallDown linear infinite;
}

.falling-heart-shape
{
width: 15px;
height: 24px;
background-color: var(--color);
border-top-left-radius: 12px;
border-top-right-radius: 12px;
transform: rotate(-45deg);
animation: sway1 ease-in-out infinite alternate;
}

.falling-heart-shape::before
{
content: "";
position: absolute;
width: 15px;
height: 24px;
left: 5px;
top: 5px;
background-color: var(--color);
transform: rotate(90deg);
border-top-left-radius: 12px;
border-top-right-radius: 12px;
}

@keyframes fallDown
{
to { transform: translateY(120vh); }
}
@keyframes fallDriftLeft
{
to { transform: translateY(120vh) translateX(-100px); }
}
@keyframes fallDriftRight
{
to { transform: translateY(120vh) translateX(100px); }
}

@keyframes sway1
{
0% { transform: rotate(-45deg) translateX(-15px) rotateZ(-10deg); }
100% { transform: rotate(-45deg) translateX(15px) rotateZ(10deg); }
}
@keyframes sway2
{
0% { transform: rotate(-45deg) translateX(-30px) rotateZ(-20deg); }
100% { transform: rotate(-45deg) translateX(30px) rotateZ(20deg); }
}
@keyframes sway3
{
0% { transform: rotate(-45deg) translateX(-10px) rotateZ(-5deg); }
100% { transform: rotate(-45deg) translateX(40px) rotateZ(25deg); }
}

/* Media queries for responsive design */
@media (max-width: 768px) {
.card-hb:hover .card {
transform: translateY(-130px);
}

.card-hb {
height: 200px;
width: 90%;
max-width: 320px;
}

.card {
height: 180px;
width: 300px;
left: 10px;
}

.text {
font-size: 28px;
}

.text-a {
font-size: 18px;
}

.gift-i {
font-size: 14px;
}

.hide {
height: 200px;
width: 340px;
top: -200px;
left: -10px;
}

.evelope::before {
height: 240px;
width: 240px;
top: -110px;
left: 40px;
}

.card-hb::before {
height: 240px;
width: 238px;
top: -110px;
left: 41px;
}

.out {
border-right: 160px #ff94a3 solid;
border-bottom: 100px solid transparent;
border-top: 96px solid transparent;
top: 5px;
left: 160px;
}

.out::before {
border-left: 326px #fd556c solid;
border-top: 196px solid transparent;
left: -160px;
top: -96px;
}

.open {
width: 20px;
height: 32px;
top: 55%;
left: 45%;
}

.open::before {
width: 20px;
height: 32px;
left: 6px;
top: 6px;
}
}

@media (max-width: 480px) {
.card-hb:hover .card {
transform: translateY(-110px);
}

.card-hb {
height: 180px;
width: 80%;
max-width: 280px;
}

.card {
height: 160px;
width: 260px;
left: 10px;
padding: 15px;
}

.text {
font-size: 24px;
margin-bottom: 10px;
}

.text-a {
font-size: 16px;
margin-bottom: 15px;
}

.gift-i {
font-size: 12px;
min-height: 24px;
}

.hide {
height: 180px;
width: 300px;
top: -180px;
left: -10px;
}

.evelope::before {
height: 210px;
width: 210px;
top: -95px;
left: 35px;
}

.card-hb::before {
height: 210px;
width: 208px;
top: -95px;
left: 36px;
}

.out {
border-right: 140px #ff94a3 solid;
border-bottom: 90px solid transparent;
border-top: 86px solid transparent;
top: 4px;
left: 140px;
}

.out::before {
border-left: 286px #fd556c solid;
border-top: 176px solid transparent;
left: -140px;
top: -86px;
}

.open {
width: 18px;
height: 28px;
top: 55%;
left: 45%;
}

.open::before {
width: 18px;
height: 28px;
left: 5px;
top: 5px;
}

.music-controls {
top: 15px;
right: 15px;
}

.music-toggle {
width: 40px;
height: 40px;
}

.music-toggle i {
font-size: 20px;
}

.music-label {
font-size: 12px;
}
}
</style>
</head>
<body>
<div id="intro-container"></div>
<div id="falling-hearts-container"></div>

<div class="music-controls">
<div class="music-toggle" id="musicToggle">
<i class="fas fa-volume-mute"></i>
</div>
<div class="music-label">Music</div>
</div>

<!-- FIX 2: the old src was a Google Drive "view" link (/view?usp=sharing) which serves
     an HTML viewer page, NOT audio — so playback always failed.
     Now: local music.mp3 first (ship it next to this file), with the Drive
     direct-download endpoint as an automatic fallback <source>. -->
<audio id="audioPlayer" loop preload="auto">
<source src="music.mp3" type="audio/mpeg">
<source src="https://drive.usercontent.google.com/download?id=1y5h1OqGpTwoQXmlS_p4QiZEgfIPpWOdp&amp;export=download" type="audio/mpeg">
</audio>

<div class="container">
<div class="card-hb disabled-hover">
<div class="hide"></div>
<div class="evelope"></div>
<div class="open"></div>
<div class="card">
<div class="a-i">
<h1 class="text">Happy Women's Day</h1>
<div class="gift-i"></div>
</div>
</div>
<div class="out"></div>
</div>
</div>

<script>
const evelope=document.querySelector('.evelope');
const hide=document.querySelector('.hide');
const cardHb=document.querySelector('.card-hb');
const open=document.querySelector('.open');
const giftI = document.querySelector('.gift-i');
const musicToggle = document.getElementById('musicToggle');
const audioPlayer = document.getElementById('audioPlayer');
let envelopeVisible=true;
let typingAnimation = null;
let isTyping = false;
let hasStartedTyping = false;
let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

// --- FIX 3: audio controls rewritten --------------------------------------
// The old code flipped a manual `isPlaying` flag even when play() failed,
// so the button desynced from reality. The UI is now driven by the real
// 'play' / 'pause' events, so it can never go out of sync.

function updateMusicUI() {
const playing = !audioPlayer.paused;
musicToggle.classList.toggle('playing', playing);
musicToggle.innerHTML = playing
? '<i class="fas fa-volume-up"></i>'
: '<i class="fas fa-volume-mute"></i>';
}

musicToggle.addEventListener('click', function() {
if (audioPlayer.paused) {
audioPlayer.play().catch(function(error) {
console.error("Error playing audio:", error);
});
} else {
audioPlayer.pause();
}
});

audioPlayer.addEventListener('play', updateMusicUI);
audioPlayer.addEventListener('pause', updateMusicUI);

audioPlayer.addEventListener('error', function(e) {
console.error("Audio error:", e);
});

updateMusicUI();

// FIX 4 + AUTOPLAY: browsers only allow audible playback after a user gesture.
// Strategy: (1) try to start the music the moment the page opens — browsers
// with permissive autoplay settings will play immediately; (2) if the browser
// blocks it, the very first touch / click / keypress anywhere on the page
// starts the music (playing inside a gesture handler is always allowed).
function startMusicOnFirstInteraction() {
const startMusic = function() {
document.removeEventListener('touchend', startMusic);
document.removeEventListener('click', startMusic);
document.removeEventListener('keydown', startMusic);
if (audioPlayer.paused) {
audioPlayer.play().catch(function(error) {
console.error("Error playing audio:", error);
});
}
};

document.addEventListener('touchend', startMusic);
document.addEventListener('click', startMusic);
document.addEventListener('keydown', startMusic);
}

function tryAutoplay() {
audioPlayer.play().catch(function() {
// Autoplay with sound was blocked by the browser — arm the
// one-time first-gesture starter instead.
startMusicOnFirstInteraction();
});
}

tryAutoplay();

// Note: the old audioPlayer 'ended' listener was removed — the `loop`
// attribute on the <audio> element already handles seamless repeating.

// Random greeting pool — a new one is picked every time the envelope is reopened
const messages = [
"Chúc bạn một ngày 20/10 vui vẻ, ngập tràn hoa, quà và những lời yêu thương.",
"Chúc bạn ngày 20/10 thật vui vẻ, luôn xinh đẹp, hạnh phúc và gặp thật nhiều may mắn trong cuộc sống. Mong mọi điều tốt đẹp nhất sẽ đến với bạn!",
"Chúc bạn có một ngày 20/10 ngập tràn hoa, quà, tiếng cười và những điều bất ngờ đáng yêu!"
];

let lastIndex = -1;

function pickRandomMessage() {
let i;
do {
i = Math.floor(Math.random() * messages.length);
} while (messages.length > 1 && i === lastIndex);
lastIndex = i;
return messages[i];
}

let message = pickRandomMessage();

function typeWriter(text, element, speed = 50) {
if (isTyping || hasStartedTyping) return;

isTyping = true;
hasStartedTyping = true;
element.innerHTML = '';
let i = 0;

typingAnimation = setInterval(() => {
if (i < text.length) {
element.innerHTML += text.charAt(i);
i++;
} else {
clearInterval(typingAnimation);
isTyping = false;
}
}, speed);
}

function resetTypingEffect() {
if (typingAnimation) {
clearInterval(typingAnimation);
isTyping = false;
}
hasStartedTyping = false;
giftI.innerHTML = '';
message = pickRandomMessage();
}

function startTypingOnOpen() {
setTimeout(() => {
if (!hasStartedTyping) {
typeWriter(message, giftI);
}
}, 500);
}

// For desktop
cardHb.addEventListener('mouseenter', () => {
if (!cardHb.classList.contains('disabled-hover') && !hasStartedTyping) {
typeWriter(message, giftI);
}
});

// For mobile - use touch events
if (isMobile) {
cardHb.addEventListener('touchstart', (e) => {
if (!cardHb.classList.contains('disabled-hover') && !hasStartedTyping) {
typeWriter(message, giftI);
}
});
}

evelope.addEventListener('click', e => {
e.stopPropagation();
evelope.style.display='none';
hide.style.display='none';
open.style.display='none';
envelopeVisible=false;
cardHb.classList.remove('disabled-hover');
resetTypingEffect();
startTypingOnOpen();
});

open.addEventListener('click', e => {
e.stopPropagation();
evelope.style.display='none';
hide.style.display='none';
open.style.display='none';
envelopeVisible=false;
cardHb.classList.remove('disabled-hover');
resetTypingEffect();
startTypingOnOpen();
});

cardHb.addEventListener('click', e => {
if(!envelopeVisible){
e.stopPropagation();
evelope.style.display='block';
hide.style.display='block';
open.style.display='flex';
envelopeVisible=true;
cardHb.classList.add('disabled-hover');
resetTypingEffect();
}
});

document.querySelector('.card').addEventListener('click', e => {
e.stopPropagation();
});

// ---- Heart intro burst + endless falling hearts (ported from the Valentine version) ----
// On load: 200 hearts bloom across the screen and fall away, then the card
// fades in (see the .container opacity transition) and it starts raining hearts.
function createHeartIntro() {
const introContainer = document.getElementById('intro-container');
const colors = ['#ee6779', '#fd556c', '#ff94a3', '#ffc1cc', '#ffffff', '#e35d6a'];
const heartCount = 200;

for (let i = 0; i < heartCount; i++) {
const heart = document.createElement('div');
heart.classList.add('intro-heart');
const color = colors[Math.floor(Math.random() * colors.length)];
heart.style.setProperty('--heart-color', color);

const left = Math.random() * 100;
const top = Math.random() * 100;
heart.style.left = left + 'vw';
heart.style.top = top + 'vh';
heart.style.setProperty('--random-top', top + 'vh');

const scale = Math.random() * 4 + 2;
heart.style.setProperty('--final-scale', scale);

heart.style.zIndex = Math.floor(Math.random() * 100);

const delay = Math.random() * 0.8;
heart.style.animationDelay = delay + 's';

introContainer.appendChild(heart);
}

setTimeout(() => {
document.querySelector('.container').style.opacity = '1';

startFallingHearts();
}, 4000);

setTimeout(() => {
introContainer.remove();
}, 5000);
}

function startFallingHearts() {
const container = document.getElementById('falling-hearts-container');
const colors = ['#ee6779', '#fd556c', '#ff94a3', '#ffc1cc', '#ffffff'];

const fallAnims = ['fallDown', 'fallDriftLeft', 'fallDriftRight'];
const swayAnims = ['sway1', 'sway2', 'sway3'];

setInterval(() => {
const wrapper = document.createElement('div');
wrapper.classList.add('falling-heart-wrapper');

const heart = document.createElement('div');
heart.classList.add('falling-heart-shape');

const color = colors[Math.floor(Math.random() * colors.length)];
heart.style.setProperty('--color', color);

wrapper.style.left = Math.random() * 100 + 'vw';

const scale = Math.random() * 1.2 + 0.5;
wrapper.style.transform = `scale(${scale})`;

const fallDuration = Math.random() * 4 + 4;
wrapper.style.animationDuration = `${fallDuration}s`;

const swayDuration = Math.random() * 2 + 2;
heart.style.animationDuration = `${swayDuration}s`;

const randomFall = fallAnims[Math.floor(Math.random() * fallAnims.length)];
const randomSway = swayAnims[Math.floor(Math.random() * swayAnims.length)];

wrapper.style.animationName = randomFall;
heart.style.animationName = randomSway;

wrapper.appendChild(heart);
container.appendChild(wrapper);

setTimeout(() => {
wrapper.remove();
}, fallDuration * 1000);

}, 150);
}

// Kick off the intro as soon as the DOM is ready — waiting for 'load' would
// also wait for the 3.6MB music.mp3 to download and delay the effect.
if (document.readyState === 'loading') {
document.addEventListener('DOMContentLoaded', createHeartIntro);
} else {
createHeartIntro();
}
</script>
</body>
</html>
